server {
    listen 80;
    server_name platform.sakrylle.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name platform.sakrylle.com;

    ssl_certificate /etc/letsencrypt/live/sakrylle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakrylle.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 100M;

    location = /favicon.ico {
        alias /srv/nginx-static/favicon-64.png;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location /static/ {
        alias /srv/nginx-static/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://sub2api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
