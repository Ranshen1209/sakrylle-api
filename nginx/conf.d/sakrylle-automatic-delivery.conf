# Draft only. Copy to /opt/stack/nginx/conf.d/ after DNS/cert/env are ready.
server {
    listen 8443 ssl http2;
    server_name automatic-delivery.sakrylle.com;

    ssl_certificate /opt/stack/certs/live/sakrylle.com/fullchain.pem;
    ssl_certificate_key /opt/stack/certs/live/sakrylle.com/privkey.pem;

    location = /health {
        proxy_pass http://sub2api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /integrations/agiso/delivery {
        proxy_pass http://sub2api:8080/integrations/agiso/delivery;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
